services:
  image-api:
    image: image-api
    container_name: image-api
    platform: linux/amd64
    runtime: nvidia
    user: "1000:1000"
    environment:
      - DD_TRACE_ENABLED=false
    ports:
      - "8000:8000"
    volumes:
      - ./test_images:/app/test_images
      - ./output:/app/output
      - ./output:/tmp/data/rd
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  audio-api:
    image: audio-api
    container_name: audio-api
    platform: linux/amd64
    runtime: nvidia
    user: "1000:1000"
    environment:
      - DD_TRACE_ENABLED=false
    ports:
      - "5002:5000"
    volumes:
      - ./audio-requests:/requests
      - ./audio-results:/results
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  video-api:
    image: video-api
    container_name: video-api
    platform: linux/amd64
    runtime: nvidia
    user: "1000:1000"
    environment:
      - DD_TRACE_ENABLED=false
    ports:
      - "5003:5000"
    volumes:
      - ./video-requests:/app/requests
      - ./video-results:/app/results
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  network-api:
    build: ./network-api
    container_name: network-api
    user: "1000:1000"
    ports:
      - "3000:3000"
    volumes:
      - ./test_images:/app/test_images
      - ./output:/app/output
      - ./audio-requests:/app/test_audio
      - ./audio-results:/app/audio_output
      - ./video-requests:/app/test_video
      - ./video-results:/app/video_output
      - ./uploads:/app/uploads
    depends_on:
      - image-api
      - audio-api
      - video-api
    restart: unless-stopped

  network-api-dev:
    build: ./network-api
    container_name: network-api-dev
    user: "1000:1000"
    command: npm run dev
    ports:
      - "3000:3000"
    volumes:
      - ./network-api:/app
      - /app/node_modules
      - ./test_images:/app/test_images
      - ./output:/app/output
      - ./audio-requests:/app/test_audio
      - ./audio-results:/app/audio_output
      - ./video-requests:/app/test_video
      - ./video-results:/app/video_output
      - ./uploads:/app/uploads
    depends_on:
      - image-api
      - audio-api
      - video-api
    restart: unless-stopped
